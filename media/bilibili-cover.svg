  <text x="802" y="1047" fill="#496158" font-family="Microsoft YaHei UI, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="34" font-weight="600" letter-spacing="2">角色 · 星级 · 优先级 · 一键识别</text>
