    <circle cx="194" cy="34" r="10" fill="#e84b85"/>
    <text x="219" y="46" fill="#b02a5d">红因子</text>
    <rect x="320" y="0" width="142" height="68" rx="34" fill="#e3f2c8"/>
    <circle cx="354" cy="34" r="10" fill="#4e8e04"/>
    <text x="379" y="46" fill="#376900">绿因子</text>
