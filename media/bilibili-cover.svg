<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">种马搜索器 B 站视频封面</title>
  <desc id="desc">插件图标搭配“吗哩吗哩工具箱扩展插件”和“快速搜索大赛种马”文字。</desc>
  <defs>
    <linearGradient id="banner" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8a18"/>
      <stop offset="1" stop-color="#ffc400"/>
    </linearGradient>
    <linearGradient id="iconFrame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9b22"/>
      <stop offset="0.52" stop-color="#ffcf21"/>
      <stop offset="1" stop-color="#ff779d"/>
    </linearGradient>
    <pattern id="watermark" width="260" height="118" patternUnits="userSpaceOnUse">
      <text x="20" y="70" fill="#7d818b" fill-opacity="0.055" font-family="Microsoft YaHei UI, PingFang SC, sans-serif" font-size="30" font-weight="700" font-style="italic">Songe</text>
    </pattern>
    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="145%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#262b35" flood-opacity="0.14"/>
    </filter>
    <filter id="iconShadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#703c00" flood-opacity="0.20"/>
    </filter>
    <clipPath id="iconClip">
      <rect x="182" y="315" width="520" height="520" rx="116"/>
    </clipPath>
  </defs>

  <rect width="1600" height="1200" fill="#e8e8ed"/>
  <rect width="1600" height="1200" fill="url(#watermark)"/>
  <g filter="url(#cardShadow)">
    <rect x="82" y="88" width="1436" height="1024" rx="44" fill="#ffffff"/>
  </g>
  <rect x="82" y="88" width="1436" height="18" rx="9" fill="url(#banner)"/>
  <rect x="82" y="106" width="1436" height="1006" rx="0 0 44 44" fill="url(#watermark)" opacity="0.48"/>
  <g opacity="0.65">
    <path d="M82 88h132l48 48H82Z" fill="#ff7e19"/>
    <path d="M1518 1112h-132l-48-48h180Z" fill="#ffd019"/>
  </g>

  <g filter="url(#iconShadow)">
    <rect x="150" y="283" width="584" height="584" rx="144" fill="url(#iconFrame)"/>
    <rect x="166" y="299" width="552" height="552" rx="130" fill="#ffffff"/>
    <image x="182" y="315" width="520" height="520" preserveAspectRatio="xMidYMid slice" clip-path="url(#iconClip)" xlink:href="cover-icon.png" href="cover-icon.png"/>
  </g>

  <g transform="translate(764 230)">
    <path d="M0 0H654L714 76L654 152H0L36 76Z" fill="url(#banner)"/>
    <path d="M0 0H50L86 76L50 152H0L36 76Z" fill="#ff7517" opacity="0.88"/>
    <circle cx="651" cy="76" r="50" fill="#ffffff" opacity="0.96"/>
    <path d="M651 42l8.5 25.5L685 76l-25.5 8.5L651 110l-8.5-25.5L617 76l25.5-8.5L651 42Z" fill="#f6a600"/>
    <text x="88" y="66" fill="#ffffff" font-family="Microsoft YaHei UI, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" letter-spacing="3">吗哩吗哩工具箱</text>
    <text x="88" y="112" fill="#ffffff" font-family="Microsoft YaHei UI, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="43" font-weight="900" letter-spacing="4">扩展插件</text>
  </g>

  <g transform="translate(790 475)" font-family="Microsoft YaHei UI, PingFang SC, Noto Sans CJK SC, sans-serif" font-weight="900">
    <text x="0" y="104" fill="#30333a" font-size="104" letter-spacing="6">快速搜索</text>
    <text x="0" y="245" fill="#30333a" font-size="112" letter-spacing="5">大赛种马</text>
    <rect x="2" y="282" width="440" height="16" rx="8" fill="url(#banner)"/>
    <rect x="458" y="282" width="68" height="16" rx="8" fill="#ff83a8"/>
  </g>

  <g transform="translate(792 860)">
    <rect width="570" height="118" rx="24" fill="#f8f8fa" stroke="#dedfe5" stroke-width="3"/>
    <rect x="0" y="0" width="16" height="118" rx="8" fill="#ff9a17"/>
    <circle cx="72" cy="59" r="22" fill="#ff9a17"/>
    <path d="M61 59l8 8 16-18" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M123 39h362M123 59h304M123 79h338" fill="none" stroke="#cfd1d8" stroke-width="12" stroke-linecap="round"/>
  </g>

  <g fill="none" stroke-linecap="round">
    <path d="M118 188h180" stroke="#ff9818" stroke-width="10"/>
    <path d="M118 216h112" stroke="#ffd01c" stroke-width="10"/>
    <path d="M1302 1029h120" stroke="#ff9818" stroke-width="10"/>
    <path d="M1440 1029h42" stroke="#ffd01c" stroke-width="10"/>
  </g>
</svg>
