    <rect x="134" y="254" width="632" height="632" rx="146" fill="none" stroke="#ffffff" stroke-width="14"/>
    <image x="150" y="270" width="600" height="600" preserveAspectRatio="xMidYMid slice" clip-path="url(#iconClip)" xlink:href="cover-icon.png" href="cover-icon.png"/>
  </g>

  <g transform="translate(824 300)">
