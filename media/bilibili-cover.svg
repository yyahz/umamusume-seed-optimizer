    <text x="820" y="700" fill="url(#titleFill)" font-size="148" letter-spacing="7">种马</text>
  </g>

  <g transform="translate(822 770)" font-family="Microsoft YaHei UI, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="34" font-weight="700">
