<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">种马搜索器 B 站视频封面</title>
  <desc id="desc">插件图标搭配“吗哩吗哩工具箱扩展插件”和“快速搜索种马”文字。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9fff9"/>
      <stop offset="0.52" stop-color="#eff9ee"/>
      <stop offset="1" stop-color="#fff4d8"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15915b"/>
      <stop offset="1" stop-color="#075834"/>
    </linearGradient>
    <linearGradient id="titleFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15915b"/>
      <stop offset="1" stop-color="#075834"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#063c25" flood-opacity="0.22"/>
    </filter>
    <filter id="textShadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#075834" flood-opacity="0.13"/>
    </filter>
    <clipPath id="iconClip">
      <rect x="150" y="270" width="600" height="600" rx="132"/>
    </clipPath>
  </defs>

  <rect width="1600" height="1200" fill="url(#background)"/>
  <circle cx="113" cy="95" r="245" fill="#dff6e5" opacity="0.62"/>
  <circle cx="1530" cy="1110" r="335" fill="#ffe8a7" opacity="0.42"/>
  <path d="M0 1048 C340 928 574 1186 906 1057 C1190 946 1354 1003 1600 893 V1200 H0Z" fill="#0d7848" opacity="0.055"/>

  <g opacity="0.95">
    <rect x="1037" y="187" width="150" height="18" rx="9" fill="#008ac5"/>
    <rect x="1202" y="187" width="82" height="18" rx="9" fill="#e84b85"/>
    <rect x="1299" y="187" width="56" height="18" rx="9" fill="#4e8e04"/>
    <rect x="1370" y="187" width="26" height="18" rx="9" fill="#aa7d00"/>
  </g>

  <g filter="url(#softShadow)">
