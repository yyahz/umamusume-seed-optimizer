<svg xmlns="http://www.w3.org/2000/svg" width="440" height="280" viewBox="0 0 440 280" role="img" aria-labelledby="title desc">
  <title id="title">种马搜索器 Chrome Web Store 小型宣传图</title>
  <desc id="desc">橙黄色品牌卡片，左侧为扩展图标，右侧展示种马搜索器名称和因子识别、好友候选、优先排序功能。</desc>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8218"/>
      <stop offset="0.55" stop-color="#ffac13"/>
      <stop offset="1" stop-color="#ffd220"/>
    </linearGradient>
    <linearGradient id="iconFrame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a18"/>
      <stop offset="0.52" stop-color="#ffd020"/>
      <stop offset="1" stop-color="#ff78a0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#5a3300" flood-opacity="0.16"/>
    </filter>
    <clipPath id="iconClip">
      <rect x="28" y="63" width="142" height="142" rx="32"/>
    </clipPath>
  </defs>

  <rect width="440" height="280" fill="#ececf1"/>
  <g filter="url(#shadow)">
    <rect x="8" y="8" width="424" height="264" rx="24" fill="#ffffff"/>
  </g>
  <rect x="8" y="8" width="424" height="12" rx="6" fill="url(#brand)"/>
  <path d="M8 8h68l24 24H8Z" fill="#ff7a18" opacity="0.68"/>
  <path d="M432 272h-68l-24-24h92Z" fill="#ffd324" opacity="0.68"/>

  <rect x="20" y="55" width="158" height="158" rx="39" fill="url(#iconFrame)"/>
  <rect x="24" y="59" width="150" height="150" rx="35" fill="#ffffff"/>
  <image href="store-icon-128.png" x="28" y="63" width="142" height="142" preserveAspectRatio="xMidYMid meet" clip-path="url(#iconClip)"/>

  <g font-family="Microsoft YaHei UI, PingFang SC, Noto Sans CJK SC, sans-serif">
    <rect x="198" y="55" width="206" height="38" rx="19" fill="url(#brand)"/>
    <text x="301" y="80" fill="#ffffff" font-size="14" font-weight="800" text-anchor="middle" letter-spacing="1">吗哩吗哩工具箱扩展</text>

    <text x="198" y="139" fill="#292d35" font-size="34" font-weight="900" letter-spacing="1">种马搜索器</text>
    <text x="198" y="163" fill="#68707c" font-size="11.5" font-weight="700">因子识别 · 好友候选 · 优先排序</text>

    <g transform="translate(198 184)">
      <rect width="206" height="40" rx="12" fill="#f7f8fa" stroke="#e1e3e8"/>
      <circle cx="22" cy="20" r="10" fill="#ff9718"/>
      <path d="M17 20l4 4 7-9" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="42" y="25" fill="#444a54" font-size="13" font-weight="800">本地识别与智能排序</text>
    </g>
    <text x="402" y="246" fill="#7e838c" font-size="9" font-weight="700" text-anchor="end">by Songe</text>
  </g>

  <path d="M198 238h132" stroke="#ff9718" stroke-width="6" stroke-linecap="round"/>
  <path d="M340 238h28" stroke="#ff7da1" stroke-width="6" stroke-linecap="round"/>
</svg>
